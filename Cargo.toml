[workspace]
resolver = "3"
members = ["crates/yawm-core", "crates/yawm-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/serhatandic/yawm"
rust-version = "1.90"

[workspace.dependencies]
yawm-core = { path = "crates/yawm-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
